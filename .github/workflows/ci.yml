name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is the platform that cannot be tested locally (the dev machine is
    # darwin/arm64), and the one where permissions and symlinks behave
    # differently — so it runs here on every push.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Cross-compile all release targets
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
