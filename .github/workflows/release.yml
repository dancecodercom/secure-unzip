name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # setver bumps VERSION.md and tags in one step, so the two must agree. If
      # they drift, the assets would be named for one version and released under
      # another — fail here rather than publish a mislabelled release.
      - name: Check tag matches VERSION.md
        run: |
          file="v$(tr -d '[:space:]' < VERSION.md)"
          tag="${GITHUB_REF_NAME}"
          echo "VERSION.md=$file  tag=$tag"
          [ "$file" = "$tag" ] || {
            echo "::error::VERSION.md says $file but the tag is $tag — bump with 'setver' so both move together"
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Cross-compile
        run: make build

      - name: Checksums
        working-directory: bin
        run: sha256sum * > SHA256SUMS

      # bin/ is gitignored — these binaries exist only as release assets.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          generate_release_notes: true
